name: showcase

# Keeps data/built-with.json fresh for the Built with Monid page. The page
# reads that one file from this repo's showcase-data branch, so a merged
# entry is on the site within minutes, and the star counts behind its
# leaderboard move every three days without anyone deploying anything.
#
# Why a branch of its own: main only takes reviewed pull requests, so the
# bot cannot commit there. Everything it rewrites goes to showcase-data via
# scripts/publish-data.sh; the copies on main are just the seed.

on:
  push:
    branches: [main]
    paths: ["data/projects.yaml", "data/categories.yaml", "scripts/**"]
  schedule:
    - cron: "41 5 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Start from the previous reading on showcase-data
        run: scripts/pull-data.sh data/github.json data/visits.json
      - name: Read stars, last push and language from GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: a PostHog personal API key with query:read on the
          # monid.ai project turns on the showcase's "Most visited" tab.
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
        run: node scripts/github-meta.mjs
      - name: Rebuild README.md and data/built-with.json
        run: node scripts/build.mjs
      - name: Publish to the showcase-data branch
        run: |
          scripts/publish-data.sh "showcase: refresh GitHub metadata ($(date -u +%F))" data/github.json data/built-with.json data/visits.json
