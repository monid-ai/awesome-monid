name: showcase

# Keeps data/built-with.json fresh for the Built with Monid page. The page
# reads that one file straight from this repo, so a merged entry is on the
# site within minutes, and the star counts behind its leaderboard move every
# three days without anyone deploying anything.

on:
  push:
    branches: [main]
    paths: ["data/projects.yaml", "data/categories.yaml", "scripts/**"]
  schedule:
    - cron: "41 5 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    # The commit this job makes is itself a push to main; do not chase it.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Read stars, last push and language from GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: a PostHog personal API key with query:read on the
          # monid.ai project turns on the showcase's "Most visited" tab.
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
        run: node scripts/github-meta.mjs
      - name: Rebuild README.md and data/built-with.json
        run: node scripts/build.mjs
      - name: Commit if anything moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github.json data/built-with.json README.md
          [ -f data/visits.json ] && git add data/visits.json
          git diff --cached --quiet && echo "nothing changed" && exit 0
          git commit -m "showcase: refresh GitHub metadata ($(date -u +%F))"
          git push
