name: sweep

# Manual backup of the weekly sweep. The scheduled sweep runs on InstaCloud
# (project awesome-monid-autopr, Mondays 07:00 UTC) and merges its own PR, so
# this one has no schedule: run it from the Actions tab when that box is down.
# It finds repos on GitHub that use Monid and are not on the list, grades
# them, and opens ONE pull request for a maintainer to review. See
# tools/sweep/README.md. Needs ANTHROPIC_API_KEY or OPENAI_API_KEY in the
# repo secrets; without one the run logs that and does nothing.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Grade and print the PR body, push nothing"
        type: boolean
        default: false
      max_candidates:
        description: "Repos to grade this run"
        default: "25"

permissions:
  contents: write
  pull-requests: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/sweep/package-lock.json
      - run: npm ci
        working-directory: tools/sweep
      - name: Start from the grading state on showcase-data
        run: bash scripts/pull-data.sh data/sweep/state.json
      - name: Sweep GitHub and open the pull request
        working-directory: tools/sweep
        env:
          # SWEEP_TOKEN: a fine-grained PAT scoped to this one repo (Contents and
          # Pull requests: write). The built-in token cannot open pull requests
          # while the org keeps "Allow GitHub Actions to create and approve pull
          # requests" off, and a PAT needs no org-wide change. Without it the
          # built-in token is used and PR creation fails on that org setting.
          GITHUB_TOKEN: ${{ secrets.SWEEP_TOKEN || secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MAX_CANDIDATES: ${{ inputs.max_candidates || '25' }}
          DATA_DIR: ${{ github.workspace }}/data/sweep
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: node bin/run.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
      # main only takes reviewed pull requests, so the state goes to the
      # unprotected showcase-data branch (see scripts/publish-data.sh).
      - name: Keep the grading state on showcase-data
        if: ${{ !inputs.dry_run }}
        run: |
          bash scripts/publish-data.sh "sweep: grading state ($(date -u +%F))" data/sweep/state.json
