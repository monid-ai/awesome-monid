name: sweep

# Every three days: find repos on GitHub that use Monid and are not on the
# list, grade them, and open ONE pull request for a maintainer to review.
# See tools/sweep/README.md. Needs ANTHROPIC_API_KEY or OPENAI_API_KEY in
# the repo secrets; without one the run logs that and does nothing.

on:
  schedule:
    - cron: "23 7 */3 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Grade and print the PR body, push nothing"
        type: boolean
        default: false
      max_candidates:
        description: "Repos to grade this run"
        default: "25"

permissions:
  contents: write
  pull-requests: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/sweep/package-lock.json
      - run: npm ci
        working-directory: tools/sweep
      - name: Sweep GitHub and open the pull request
        working-directory: tools/sweep
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MAX_CANDIDATES: ${{ inputs.max_candidates || '25' }}
          DATA_DIR: ${{ github.workspace }}/data/sweep
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: node bin/run.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Keep the grading state on main
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sweep/state.json
          git diff --cached --quiet && echo "state unchanged" && exit 0
          git commit -m "sweep: grading state ($(date -u +%F))"
          git pull --rebase -q origin main
          git push
