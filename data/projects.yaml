# The single source of truth for awesome-monid.
# README.md is GENERATED from this file. Run `npm run build` after editing.
#
# Outside developers, as a rule. Our own repos are rejected by the build unless
# the maintainer puts one on the allowlist in scripts/build.mjs, which currently
# holds Jasper0122/agent-seo-kit. Keep that list short: the page is worth reading
# because nearly all of it is other people's work.
#
# Fields
#   id          kebab-case, unique, never reused
#   name        display name, no marketing suffixes
#   url         the thing a reader should open first (live app, or repo)
#   repo        owner/name on GitHub, or "" if closed source
#   author      person or org, as they want to be credited
#   category    an id from data/categories.yaml
#   kind        hosted | oss | skill | writeup   (one or more)
#   lang        py | ts | go | rust | other      (one or more, "" if n/a)
#   cost        self-reported Monid spend per run, e.g. "$0.15/lead". "" if unknown
#   monid       Monid endpoints or capability areas used, if known
#   evidence    how we know it uses Monid, see EVIDENCE in scripts/build.mjs
#   description ONE sentence, ends with a period, no sales language, no emoji
#   created     repo creation date, for the age rule
#   added       YYYY-MM-DD this entry landed here
#   verified    true once a maintainer confirmed the link works and Monid is used
#
# This block came from a 2026-09-18 sweep: GitHub repo search on four queries,
# then every README graded for hard evidence.
# Entries with verified: false still need a human to open the link and read past
# the README.

